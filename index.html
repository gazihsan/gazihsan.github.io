<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>İhsan Menderes Ok</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298, #4a00e0, #8e2de2);
        background-size: 400% 400%;
        animation: gradientAnim 18s ease infinite;
        min-height: 100vh;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    @keyframes gradientAnim {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    header {
        width: 100%;
        display: flex;
        justify-content: center; /* Fotoğraf olmayınca içeriği ortaladık */
        align-items: center;
        padding: 15px 30px;
        background: rgba(0,0,0,0.25);
        backdrop-filter: blur(10px);
        box-sizing: border-box;
    }
    header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }
    
    .card {
        margin-top: 80px;
        padding: 30px 40px 40px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        backdrop-filter: blur(10px);
        text-align: center;
        width: 350px;
        animation: fadeIn 1.3s ease;
        position: relative;
    }
    .card h2 {
        /* Fotoğraf boşluğunu telafi etmek için üst marjı azalttık */
        margin-top: 0px; 
        font-size: 26px;
    }
    .contact a {
        display: block;
        margin: 8px 0;
        color: #ffe;
        text-decoration: none;
        font-size: 18px;
        transition: 0.2s;
    }
    .contact a:hover {
        color: #ffdd88;
    }
    .about {
        margin-top: 35px;
        width: 70%;
        max-width: 900px;
        background: rgba(255,255,255,0.12);
        padding: 25px 35px;
        border-radius: 18px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        animation: fadeIn 1.4s ease;
    }
    .about h2 {
        font-size: 28px;
        margin-bottom: 10px;
        text-align: center;
    }
    .about p {
        font-size: 18px;
        line-height: 1.6;
        text-align: center;
    }
    footer {
        margin-top: auto;
        padding: 12px;
        font-size: 14px;
        opacity: 0.8;
        background: rgba(0,0,0,0.25);
        width: 100%;
        text-align: center;
        backdrop-filter: blur(8px);
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<header>
    <h1>İhsan Menderes Ok</h1>
    </header>

<div class="card">

    <h2>İhsan Menderes Ok</h2>
    <p>Bu Web Site Açık Kaynak Yazılım Geliştirme Dersi için açılmıştır.</p>

    <div class="contact">
        <h3>İletişim</h3>
        <a href="https://instagram.com/@x_ihsanmenderesok" target="_blank">📸 Instagram</a>
        <a href="mailto:ihsanmenderesok@gmil.com">📧 Gmail</a>
    </div>
</div>

<div class="about">
    <h2>Hakkımda</h2>
    <p>
       Gazi Üniversitesi TBMYO Elektrik Enerjisi Üretim İletim Dağıtım öğrencisi.
    </p>
</div>

<footer>

</footer>

</body>
</html>
